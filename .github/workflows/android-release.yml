name: Android Release

# Builds a SIGNED release APK and attaches it to a GitHub Release when a
# version tag is pushed, e.g.:
#   git tag v1.2.0 && git push origin v1.2.0
#
# Guards built in:
#  - Tag must match versionName in app/build.gradle.kts (v1.2.0 <-> "1.2.0").
#  - Signing secrets are REQUIRED here (unlike CI): an unsigned release APK
#    could not update an existing signed install.
#  - Unit tests run before the release is published.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Sign + attach release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        # actions/setup-java@v5.7.0
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      # Same provisioning rationale as android-ci.yml: the committed ./gradlew
      # is a local bootstrap that CI never executes.
      - name: Set up Gradle 8.14.3
        # gradle/actions/setup-gradle@v4.4.4
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          gradle-version: '8.14.3'
          validate-wrappers: false

      # Releases MUST be signed (no graceful unsigned fallback like CI).
      - name: Restore keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not configured. Releases must be signed — set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in Settings → Secrets and variables → Actions."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/acadora-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/acadora-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # A release APK with the wrong version label is worse than no release:
      # verify tag <-> versionName before building anything.
      - name: Verify tag matches versionName
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION_NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d '"' -f2)
          if [ "v$VERSION_NAME" != "$TAG_NAME" ]; then
            echo "::error::Tag $TAG_NAME does not match versionName \"$VERSION_NAME\" in app/build.gradle.kts. Bump versionName/versionCode, commit, delete and re-push the tag."
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Post test failures as annotations
        if: failure()
        run: python3 scripts/test-annotations.py app/build/test-results/testDebugUnitTest/*.xml

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      # Distribution-ready names + checksum for integrity verification.
      - name: Stage release files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Acadora-v${VERSION_NAME}.apk"
          (cd dist && sha256sum "Acadora-v${VERSION_NAME}.apk" > checksums.txt)
          ls -la dist

      - name: Create GitHub Release and attach APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          # Tags containing "-" (e.g. v1.2.0-rc1) are published as pre-releases.
          FLAGS=()
          if [[ "$TAG_NAME" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG_NAME" \
            "dist/Acadora-v${VERSION_NAME}.apk" \
            "dist/checksums.txt" \
            --title "Acadora ${TAG_NAME}" \
            --generate-notes \
            --verify-tag \
            "${FLAGS[@]}"

      - name: Upload release files as workflow artifact
        if: success()
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
