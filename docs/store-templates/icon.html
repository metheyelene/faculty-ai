<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../kinetic.css">
<style>
  body { width: 512px; height: 512px; background: #DFE104; }
  .canvas {
    width: 512px; height: 512px; background: #DFE104;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  /* Giant "A" built from flat black geometry, kinetic typography style */
  .a-glyph {
    position: absolute; font-family: 'Space Grotesk', sans-serif;
    font-size: 460px; font-weight: 700; letter-spacing: -0.06em; color: #09090B; line-height: 1;
  }
  .mono { position: absolute; bottom: 34px; left: 0; right: 0; text-align: center;
    font-size: 30px; font-weight: 700; letter-spacing: 0.5em; color: #09090B; text-transform: uppercase; padding-left: 0.5em; }
</style>
</head>
<body>
<div class="canvas">
  <div class="a-glyph">A</div>
  <div class="mono">ACADORA</div>
</div>
</body>
</html>
