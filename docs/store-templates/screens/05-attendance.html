<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../kinetic.css">
<style>
  body { width: 1080px; height: 2340px; }
  .phone { width: 1080px; height: 2340px; background: #09090B; color: #FAFAFA; display: flex; flex-direction: column; overflow: hidden; padding: 90px 64px 110px; position: relative; }
  .status { display: flex; justify-content: space-between; align-items: center; font-size: 30px; font-weight: 500; color: #FAFAFA; padding: 0 8px 36px; }
  .status .icons { letter-spacing: 10px; font-size: 26px; }
  .title { font-size: 96px; font-weight: 700; letter-spacing: -0.03em; line-height: 0.95; text-transform: uppercase; margin-bottom: 40px; }
  .session { border: 2px solid #27272A; padding: 34px 38px; margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; }
  .session .subj { font-size: 38px; font-weight: 700; }
  .session .meta { font-size: 26px; letter-spacing: 0.16em; color: #A1A1AA; font-weight: 500; margin-top: 10px; text-transform: uppercase; }
  .counters { display: flex; gap: 28px; margin-bottom: 44px; }
  .counter { flex: 1; border: 2px solid #27272A; padding: 32px 34px; }
  .counter .n { font-size: 96px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .counter.present .n { color: #DFE104; }
  .counter .l { font-size: 24px; font-weight: 500; letter-spacing: 0.2em; color: #A1A1AA; margin-top: 12px; text-transform: uppercase; }
  .roster-head { display: flex; align-items: center; gap: 24px; margin-bottom: 28px; }
  .roster-head .t { font-size: 28px; font-weight: 700; letter-spacing: 0.22em; color: #FAFAFA; }
  .roster-head::after { content: ''; flex: 1; height: 2px; background: #27272A; }
  .student { border: 2px solid #27272A; padding: 28px 34px; margin-bottom: 22px; display: flex; align-items: center; }
  .student .name { flex: 1; font-size: 34px; font-weight: 700; }
  .chip { width: 64px; height: 64px; border: 2px solid #27272A; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; margin-left: 14px; color: #52525B; }
  .chip.p.on { background: #DFE104; color: #09090B; border-color: #DFE104; }
  .chip.a.on { background: #FAFAFA; color: #09090B; border-color: #FAFAFA; }
  .bulk { display: flex; gap: 20px; margin-top: 8px; }
  .bulk .b { flex: 1; border: 2px solid #27272A; text-align: center; padding: 24px 0; font-size: 26px; font-weight: 700; letter-spacing: 0.16em; }
  .bulk .b.accent { border-color: #DFE104; color: #DFE104; }
  .save { position: absolute; left: 64px; right: 64px; bottom: 160px; background: #DFE104; color: #09090B; text-align: center; padding: 34px 0; font-size: 30px; font-weight: 700; letter-spacing: 0.2em; }
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span class="icons">&#9679;&#9679;&#9679; &#9635;</span></div>
  <div class="title">Attendance</div>

  <div class="session">
    <div>
      <div class="subj">Digital Signal Processing</div>
      <div class="meta">3RD YEAR · SEC A · 11 STUDENTS</div>
    </div>
  </div>

  <div class="counters">
    <div class="counter present"><div class="n">9</div><div class="l">Present</div></div>
    <div class="counter"><div class="n">2</div><div class="l">Absent</div></div>
  </div>

  <div class="roster-head"><span class="t">ROSTER</span></div>
  <div class="student">
    <div class="name">Aarav Sharma</div>
    <div class="chip p on">P</div><div class="chip a">A</div><div class="chip">L</div>
  </div>
  <div class="student">
    <div class="name">Diya Patel</div>
    <div class="chip p">P</div><div class="chip a on">A</div><div class="chip">L</div>
  </div>
  <div class="student">
    <div class="name">Rohan Mehta</div>
    <div class="chip p on">P</div><div class="chip a">A</div><div class="chip">L</div>
  </div>

  <div class="bulk">
    <div class="b accent">ALL PRESENT</div>
    <div class="b">ALL ABSENT</div>
  </div>

  <div class="save">SAVE SESSION</div>

  <div class="nav">
    <div class="item">Home</div><div class="item">Calendar</div><div class="item">Assistant</div><div class="item active">Space</div>
  </div>
</div>
</body>
</html>
